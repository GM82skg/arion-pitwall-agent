# Builds the Windows app on GitHub's servers. Push a tag like v0.1.1 → a release with the .exe attached.
# "Run workflow" (manual) builds and tests without making a release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Name the file with the version
        shell: pwsh
        run: Copy-Item target/release/arion-pitwall-agent.exe "ARION-Pit-Wall-${{ github.ref_name }}.exe"
      - name: Keep the exe (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ARION-Pit-Wall
          path: ARION-Pit-Wall-*.exe
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "ARION-Pit-Wall-${{ github.ref_name }}.exe" --title "ARION Pit Wall ${{ github.ref_name }}" --notes "Windows app for drivers. See README for how to use it."
