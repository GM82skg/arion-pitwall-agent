# Builds the Windows app on GitHub's servers. Push a tag like v0.1.1 → a release with the .exe attached.
# "Run workflow" (manual) builds and tests without making a release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Name the file with the version
        shell: pwsh
        run: Copy-Item target/release/arion-pitwall-agent.exe "ARION-Pit-Wall-${{ github.ref_name }}.exe"
      - name: Keep the exe (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ARION-Pit-Wall
          path: ARION-Pit-Wall-*.exe
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        # The SHA-256 fingerprint lets anyone check this exact file on virustotal.com (Search → paste it).
        run: |
          $f = "ARION-Pit-Wall-${{ github.ref_name }}.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          $notes = "Windows app for ARION drivers. How to install and what to do if Chrome or Windows warns: see README.`n`nSHA-256: $h`nCheck this exact file: virustotal.com > Search > paste the code above."
          # A copy with a fixed name, so the crew app's download link always gets the newest version:
          # https://github.com/GM82skg/arion-pitwall-agent/releases/latest/download/ARION-Pit-Wall.exe
          Copy-Item $f "ARION-Pit-Wall.exe"
          # The app's «Update now» checks the download against this file before using it (since v0.1.16)
          Set-Content -Path "ARION-Pit-Wall.exe.sha256" -Value "$h  ARION-Pit-Wall.exe" -Encoding ascii
          gh release create "${{ github.ref_name }}" $f "ARION-Pit-Wall.exe" "ARION-Pit-Wall.exe.sha256" --title "ARION Pit Wall ${{ github.ref_name }}" --notes $notes
      # v0.9.71 (crew app): each release goes to VirusTotal, so the crew app's «Check it for viruses» opens a ready result.
      # Needs the repo secret VT_API_KEY (George's free VirusTotal key). Without it, or if VirusTotal fails, the release is
      # unaffected: a warning only. The exe is ~15 MB, under VirusTotal's 32 MB limit for this simple upload.
      - name: Send to VirusTotal (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        shell: pwsh
        run: |
          if (-not $env:VT_API_KEY) { Write-Host "::warning::No VT_API_KEY secret: not sent to VirusTotal"; exit 0 }
          $f = "ARION-Pit-Wall-${{ github.ref_name }}.exe"
          try {
            $r = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files" -Method Post -Headers @{ "x-apikey" = $env:VT_API_KEY } -Form @{ file = Get-Item $f }
            Write-Host "Sent to VirusTotal: $($r.data.id)"
          } catch {
            Write-Host "::warning::VirusTotal upload failed: $($_.Exception.Message)"
          }
          exit 0
