<style>
:root{--bg:#0E0F11;--pn:#16171A;--ln:#2B2D33;--tx:#E6E7EA;--mu:#8C8F98;--y:#F2C200;--g:#3BD16F;--r:#FF5A5A;--a:#FFB020;--c:#39C5F0;--p:#C9A8FF;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:var(--tx);background:#1F2024;border:1px solid var(--ln);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:#4A4D56}
button.on{border-color:var(--y);color:var(--y);background:#3A3000}
input{font:inherit;color:var(--tx);background:#0E0F11;border:1px solid var(--ln);border-radius:6px;padding:9px 11px;width:100%}
.m{font-family:var(--mono)}.mu{color:var(--mu)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.a{color:var(--a)}.c{color:var(--c)}
#app{display:flex;flex-direction:column;height:calc(100vh / var(--z,1));padding:10px;gap:10px;zoom:var(--z,1)}
.zm{display:inline-flex;align-items:center}.zm button{padding:4px 9px;border-radius:0}.zm button:first-child{border-radius:6px 0 0 6px}.zm button:last-child{border-radius:0 6px 6px 0}.zm #zmV{min-width:54px;font-family:var(--mono);font-size:12px;margin:0 -1px}
body.phone .zm,body.obs .zm{display:none}
/* v0.1.16: one settings icon at the top right holds zoom, panels and reset */
#gear{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px}#gear svg{width:18px;height:18px;display:block}#gear.on{border-color:var(--y);color:var(--y);background:#3A3000}
.setpop{width:250px}.setpop>b{display:block;font-size:12px;color:var(--mu);font-weight:500;margin:8px 0 5px}.setpop>b:first-child{margin-top:0}.setpop .zm{display:inline-flex}
.setpop .setsep{border-top:1px solid var(--ln);margin:9px 0 8px}.setpop #lreset,.setpop #sout{width:100%}
/* v0.1.18: Sign out lives in the ⚙ menu (no stray clicks next to the gear); phones have no ⚙, so they keep it in the top bar */
#out{display:none}body.phone.signed #out{display:inline-block}
/* v0.1.16: your position, bottom right of the track map */
.mpos{position:absolute;right:10px;bottom:8px;text-align:right;pointer-events:none;font-family:var(--mono);line-height:1;z-index:1}
.mpos b{display:block;font-size:34px;font-weight:800}
body.phone .mpos b{font-size:28px}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;flex-wrap:wrap}
.wm{display:block;height:24px;width:auto;aspect-ratio:1202/238;color:#F5F5F7}
.brand{display:flex;align-items:center;gap:9px}
/* v0.1.15: «Pit Wall» and the version under it, together exactly as tall as the ARION logo (24 px; 22 px on phones) */
.brand .bt{display:flex;flex-direction:column;justify-content:space-between;height:24px}.brand b{font-weight:600;font-size:14px;line-height:14px}.brand #bver{font-style:normal;font-size:10px;line-height:10px;color:var(--mu)}
.sep{border-left:1px solid var(--ln);height:22px}
.chip{border-radius:5px;padding:2px 9px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;gap:8px;align-items:center;padding:5px 11px;border-radius:6px;border:1px solid var(--ln);background:#1A1B1F;font-family:var(--mono);font-size:13px;cursor:pointer}
.tab.on{background:#3A3000;border-color:var(--y)}
.adot{width:9px;height:9px;border-radius:50%;display:inline-block}.adot.amb{background:var(--a)}.adot.red{background:var(--r);animation:adot 1.6s ease-in-out infinite}
@keyframes adot{0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,.6)}50%{box-shadow:0 0 0 5px rgba(255,90,90,0)}}
@media (prefers-reduced-motion:reduce){.adot.red{animation:none}}
.grow{flex:1}
.main{flex:1;display:flex;min-height:0;position:relative}
.dcol{display:flex;flex-direction:column;min-width:220px;min-height:0}
.dock{display:flex;flex-direction:column;overflow:hidden;min-height:60px;container-type:inline-size}
/* panels that show a fixed set of facts are never smaller than those facts (no cutting, no hiding);
   the map, inputs and the growing lists have a fixed minimum and scroll or scale inside */
.dock.fit{overflow:visible;min-height:auto}.dock.fit>.body{overflow:visible;flex:1 0 auto}
#car{display:flex;flex-direction:column}.dock #car .tyres{grid-auto-rows:1fr}#car .tyre{display:flex;flex-direction:column;justify-content:center}
.dock #wx{display:flex;flex-direction:column}#wx .slot{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:3px 2px}#wx .slot>div{line-height:1.25}
#dmg{display:flex;flex-direction:column}
.dcol{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3A3D45 transparent}
.main{overflow-x:auto}
.dock .ph{flex-wrap:wrap;row-gap:4px}
@container (max-width:340px){
  .big{font-size:16px}.k3{gap:4px}.tyres{gap:4px}.tyre{padding:5px 7px}.tyre span[style*="16px"]{font-size:14px!important}
  table.t{font-size:11px}table.t td,table.t th{padding:2px 3px}.lw{display:none}
  #battle table.t td:nth-child(3),#battle table.t th:nth-child(3),#battle table.t td:nth-child(5),#battle table.t th:nth-child(5),#battle table.t td:nth-child(6),#battle table.t th:nth-child(6),#battle table.t td:nth-child(7),#battle table.t th:nth-child(7){display:none}
  .slots{font-size:11px;gap:3px}.next{font-size:12px}
}
/* tables give up their least important columns as their panel gets narrower */
@container (max-width:560px){#battle .lw{display:none}#battle table.t td:nth-child(5),#battle table.t th:nth-child(5),#battle table.t td:nth-child(6),#battle table.t th:nth-child(6),#battle table.t td:nth-child(7),#battle table.t th:nth-child(7){display:none}}
@container (max-width:400px){#laps table.t:not(.st) td:nth-child(2),#laps table.t:not(.st) th:nth-child(2){display:none}#laps table.t{font-size:11.5px}#laps table.t td,#laps table.t th{padding:2px 3px}}
@container (max-width:330px){#laps table.t:not(.st) td:nth-child(7),#laps table.t:not(.st) th:nth-child(7){display:none}}
@container (max-width:290px){#laps table.t{font-size:10.5px}#laps table.t td,#laps table.t th{padding:2px 2px}#laps .sc{padding:0 2px}}
@container (max-width:380px){#car .stl{display:none}}
@container (max-width:300px){.tyre .mu{display:none}#car .k3.m{grid-template-columns:repeat(2,1fr)!important}}
@container (max-width:250px){.big{font-size:14px}#car .k3:first-of-type{grid-template-columns:1fr 1fr}#car .k3 > div:nth-child(3){display:none}}
@container (max-width:300px){#dmg .carsvg{display:none}}
@container (max-width:480px){#zv{display:none}}   /* narrow map: the zoom readout goes first, so the header stays one line */
.dock>.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin;scrollbar-color:#3A3D45 transparent}
.dock>.body::-webkit-scrollbar{width:6px}.dock>.body::-webkit-scrollbar-thumb{background:#3A3D45;border-radius:3px}
.dock .ph{cursor:grab;user-select:none;touch-action:none}.dock .ph button,.dock .ph input{cursor:pointer}
.gx{flex:0 0 10px;cursor:col-resize;position:relative}.gy{flex:0 0 10px;cursor:row-resize;position:relative}
.gx:hover::after,.gy:hover::after,.gx.on::after,.gy.on::after{content:'';position:absolute;background:var(--y);opacity:.5;border-radius:2px}
.gx:hover::after,.gx.on::after{left:4px;top:0;bottom:0;width:2px}.gy:hover::after,.gy.on::after{top:4px;left:0;right:0;height:2px}
.dropln{position:fixed;background:var(--y);border-radius:2px;z-index:20;pointer-events:none;box-shadow:0 0 10px var(--y)}
/* v0.1.17: splits inside columns, tab groups, and the drop-zone highlight while dragging */
.lrow{display:flex;min-height:0;min-width:0}.lcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.dropz{position:fixed;z-index:19;pointer-events:none;border:2px solid var(--y);border-radius:8px;background:rgba(242,194,0,.14);display:none}
.dropz[data-side=tab]{background:rgba(242,194,0,.08);border-style:dashed}
.tgrp{display:flex;flex-direction:column;overflow:hidden;min-height:60px;padding-top:6px}
.tstrip{display:flex;gap:2px;margin:0 0 8px;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none;flex:none}
.ttab{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--mu);font-size:13px;padding:5px 11px 6px;cursor:grab;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.ttab:hover{color:var(--tx);border:0}.ttab.on{color:var(--tx);background:#1F2024;box-shadow:inset 0 -2px 0 var(--y)}
.tgrp>section.dock{flex:1 1 0;min-height:0;border:0;padding:0;background:none}.tgrp>section.dock[hidden]{display:none}
.tgrp>section.dock.fit{flex:1 1 0;overflow:auto}
/* inside a tab group the tab names the panel, so its own title goes (the car keeps the driver's name) */
.intab:not([data-id=car]) .ph>b:first-child{display:none}
.dragging{opacity:.45}
body.resizing,body.resizing *{cursor:inherit!important;user-select:none}
.carsvg rect{transition:fill .3s}
.scrl{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#3A3D45 transparent}
.scrl::-webkit-scrollbar{width:6px;height:6px}.scrl::-webkit-scrollbar-track{background:transparent}.scrl::-webkit-scrollbar-thumb{background:#3A3D45;border-radius:3px}.scrl::-webkit-scrollbar-thumb:hover{background:#4A4D56}.scrl::-webkit-scrollbar-corner{background:transparent}
#traffic{overflow:hidden}.tt td.nm{max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt td:nth-child(3){width:34%}.tt td:nth-child(4){width:30%}.tt tr.me td{background:#2A2400}.tt td,.tt th{white-space:nowrap}.tt .gp,.mt .gp{text-align:right}
.mt td{white-space:nowrap;vertical-align:top}.mt td.tx{white-space:normal;width:100%;font-family:Inter,system-ui,sans-serif}
.rl{white-space:nowrap}.rl>span{flex:none}.rl>span.nm{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}.rl>span.grow{flex:1 1 0}
.tyre .mu{font-size:12px}.tyre .tl1{white-space:nowrap;font-size:14px}.tyre .tl1 b{font-size:17px;font-weight:600}.tyre .tl2{white-space:nowrap;font-size:11.5px}
table.t{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}table.t td,table.t th{padding:3px 4px;text-align:left;white-space:nowrap}table.t th{font-family:Inter,sans-serif;font-weight:400;color:var(--mu)}table.t tr+tr td{border-top:1px solid #23252A}
.sc{border-radius:3px;padding:0 4px}.sc.pu{background:#3B2760;color:#C9A8FF}.sc.gn{background:#13361F;color:#3BD16F}.sc.yl{background:#3A3000;color:#F2C200}
.tb{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.tb button{padding:3px 9px;font-size:12px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-family:var(--mono);font-size:12px}.slot{border:1px solid var(--ln);border-radius:6px;padding:4px 2px}.slot.past{opacity:.45}.slot.now{border-color:#E6E7EA}.slot.nx{border-color:var(--a);background:#2A1F08}
.next{border:1px solid var(--a);background:#2A1F08;border-radius:6px;padding:7px 9px;margin-top:8px;font-size:13px}
.mom{display:grid;gap:3px;font-family:var(--mono);font-size:12px}

.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:0}
.ph{display:flex;align-items:center;gap:8px;color:var(--mu);margin-bottom:8px;font-size:13px}
.ph b{font-weight:500;color:#D5D7DC;font-size:14px}
.fill{flex:1;display:flex;flex-direction:column}
.cv{flex:1;position:relative;min-height:0}.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.big{font-family:var(--mono);font-size:20px}

.inptop{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;margin:0 0 6px}

.bar{height:9px;background:#25272C;border-radius:5px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
.rl{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;font-family:var(--mono);font-size:13px}
.rl.me{border:1px solid var(--y)}
.pill{border-radius:4px;padding:0 6px;font-size:12px;font-family:var(--mono)}
.center{flex:1;display:grid;place-items:center}

.lg{display:flex;gap:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.ft{font-size:12px;color:var(--mu);text-align:center}

/* ---------- phone (v0.1.6): one topic per screen, tab bar at the bottom ---------- */
body.phone #app{padding:0;gap:0;height:100dvh}
body.phone .top{border-radius:0;border-width:0 0 1px;padding:calc(6px + env(safe-area-inset-top)) 12px 8px;gap:8px}

body.phone .brand{flex:1 1 100%;justify-content:center;padding:2px 0 4px}body.phone .wm{height:22px}body.phone .brand .bt{height:22px}body.phone .brand b{font-size:13px;line-height:13px}body.phone .brand #bver{font-size:9px;line-height:9px}
body.phone #sess{order:2;font-size:12px;flex:1 1 auto;min-width:0}body.phone #link{order:3;font-size:12px}body.phone #out{order:4}

// ---------- D: strategy alert (v0.1.10) ----------
// Plays through pitting now, after 1 more lap, after 2 more laps, or staying out until your energy runs out, for every
// car in your class, and speaks only when a stop clearly gains places (needs the same answer 3 times in a row).
// What it can't see: rivals' tyre wear (each car is assumed to lose time with tyre age like you), the true pit loss before
// your first stop (LMU's stop estimate + 25 s lane), and safety cars (it stays silent under yellow).
const carNo=g=>{const m=/#\s?(\d+)/.exec(g&&g.car||'');return m?'#'+m[1]:esc(((g&&g.name)||'?').split(' ').pop())};
function laneTime(){return S.lane||25}
function learnLane(j){const w=S.pitWatch;if(!w)return;const me=j.grid.find(g=>g.player);if(!me||me.laps<w.lap+2)return;S.pitWatch=null;
  if(!(w.pace>0)||!(w.stop>0))return;
  // your pit loss: the two laps around the stop that took longest, minus two normal laps; the lane is that minus the stop itself
  const L=S.laps.filter(l=>l.lap>=w.lap&&l.lap<=w.lap+2&&l.time>0);let worst=0;
  for(const a of L){const b=L.find(x=>x.lap===a.lap+1);if(b)worst=Math.max(worst,a.time+b.time)}
  const lane=worst-2*w.pace-w.stop;if(worst&&lane>=5&&lane<=120){S.lane=lane;moment('⏱',`Pit lane measured: ${lane.toFixed(0)} s`,'')}}
// tyre loss per lap of age, from your clean laps of this stint (0.05 s/lap until there are 5 of them)
function degSlope(me){const c=S.per.get(me.id);if(!c)return 0.05;
  const pts=c.times.filter(x=>x.lap>c.stintStart+1&&x.t>0).map(x=>[x.lap-c.stintStart,x.t]);if(pts.length<5)return 0.05;
  const mt=pts.reduce((a,p)=>a+p[1],0)/pts.length;const ok=pts.filter(p=>Math.abs(p[1]-mt)<2);if(ok.length<5)return 0.05;
  const n=ok.length,ma=ok.reduce((a,p)=>a+p[0],0)/n,mb=ok.reduce((a,p)=>a+p[1],0)/n;let sxy=0,sxx=0;for(const p of ok){sxy+=(p[0]-ma)*(p[1]-mb);sxx+=(p[0]-ma)**2}
  return sxx>0?Math.max(0,Math.min(0.3,sxy/sxx)):0.05}
// distance covered (in laps) after T seconds, stopping once at the end of lap `stopAt`
function runCar(c,T){let t=T-(c.pen||0),laps=c.laps,frac=c.frac,age=c.age,stopped=c.stopAt==null;
  for(let n=0;n<300&&t>0;n++){const lt=c.base+c.slope*age,rem=(1-frac)*lt;
    if(rem>=t)return laps+frac+t/lt;

// what to do at a stop after k more laps: the lap you must stop by (energy), VE to fill to the flag (+3 %), tyres under 70 % life
function tyrePlan(j){const w=((j.car||{}).wheels||[]).map(x=>x&&x.wear),chg=['FL','FR','RL','RR'].filter((_,i)=>w[i]!=null&&w[i]>=0&&w[i]<0.7);

function stopPlan(j,me,k){const e=energyLeft(me);if(!e||e.per==null)return null;
  const L=S.trackLen>100?S.trackLen:null,c=S.cars.get(me.id),fr=L&&c?Math.max(0,Math.min(0.999,c.dist/L)):0.5;
  const forced=me.laps+Math.max(1,Math.floor(e.laps+fr)),p=pace(me.id),se=j.session,P=(S.rest||{}).pit||{};
  let ve=null;if(p){const after=Math.max(0,(se.left>0?se.left:45*p)-(k+1-fr)*p-(P.total||0)-laneTime());ve=Math.min(1,Math.ceil(after/p)*e.per+0.03)}
  return {forced,ve,ty:tyrePlan(j)}}
function stratModel(j){

  if(!me||!(se.type>=10)||se.phase!==5||se.yellow>0||me.pits||me.pitState>0)return null;
  const P=(S.rest||{}).pit;if(!P||!(P.total>0))return null;
  const loss=P.total+laneTime(),L=S.trackLen>100?S.trackLen:null,slope=degSlope(me);
  const frac=g=>{const c=S.cars.get(g.id);return L&&c?Math.max(0,Math.min(0.999,c.dist/L)):0.5};
  const mk=(g,stopAt)=>{const p=pace(g.id),c=S.per.get(g.id),age=c?Math.max(0,g.laps-c.stintStart):0;
    return {id:g.id,g,laps:g.laps,frac:frac(g),age,slope,base:Math.max(p*0.9,p-slope*age),stopAt,loss,p,pen:penLoss(g)}};

  const forced=me.laps+Math.max(1,Math.floor(myE.laps+frac(me)));   // the lap you must come in at the end of
  if(forced<=me.laps+1)return null;   // no choice left: the stop is this lap anyway

    const ahead=riv.filter(r=>R.get(r.id)>M-margin);return {k,pos:1+unAhead+ahead.length,ahead:new Set(ahead.map(r=>r.id))}};

  const near=[order[mi-1],order[mi+1]].filter(Boolean),nowT=Date.now();
  const cov=best.k<=1?near.find(g=>{const c=S.per.get(g.id);return c&&c.stopAt&&nowT-c.stopAt<90000}):null;

  const plan=stopPlan(j,me,best.k),ve=plan.ve??1,ty=plan.ty;

    rows:[...opts.map(o=>({k:o.k,pos:o.pos,d:stay.pos-o.pos,best:o===best})),{k:null,pos:stay.pos,d:null,best:false}],
    ve,ty,repair:P.repair>0?P.repair:0,loss,est:!S.lane,forced,
    pens:[me,...inCls].filter(g=>(g.pens||[]).length).map(g=>({no:g.id===me.id?'you':carNo(g),t:g.pens.map(PSHORT).join(' + '),loss:penLoss(g)}))}}
function stratStep(j){
  const r=stratModel(j),key=r?`${r.k}:${r.cover?r.cover.id:''}`:'',now=Date.now(),me=j.grid.find(g=>g.player);
  S.stHist.push(key);if(S.stHist.length>3)S.stHist.shift();
  const steady=key&&S.stHist.length===3&&S.stHist.every(x=>x===key);
  if(steady){const isNew=!S.st||S.st.key!==key;S.st={...r,key,since:isNew?now:S.st.since};
    if(isNew)moment('⛽',`${stLabel(S.st)}: +${r.gain} in class`,'y')}

// v0.1.20: trail colour per point from the pedals (George's choice A): brake red (wins when both are pressed),
// throttle green, no pedal grey; 5 % dead zone. Light grey, so it can't be taken for the darker previous-lap line.
function pedalColours(pts){return pts.map(p=>p[4]>0.05?'#FF5A5A':p[3]>0.05?'#3BD16F':'#9A9DA6')}
// H (v0.1.11): your car glides between telemetry frames like the others, and the map follows that glided position and a
// smoothed heading, so the arrow sits still on screen instead of jumping as frames arrive unevenly
function mePos(){const a=S.me0,b=S.me1;if(!b)return null;if(!a)return b;const k=Math.max(0,Math.min(1,(performance.now()-b.t)/Math.max(16,b.t-a.t)));return {x:a.x+(b.x-a.x)*k,z:a.z+(b.z-a.z)*k}}
// critically damped spring ("smooth damp", ~0.3 s): both the angle and the turn rate stay continuous
let lastHs=0;
function smoothHeading(){const t=performance.now(),dt=Math.min(0.1,Math.max(0.001,(t-lastHs)/1000));lastHs=t;const h=S.heading;if(h==null)return null;
  if(S.hs==null){S.hs=h;S.hv=0;return h}
  let c=S.hs-h;while(c>Math.PI)c-=2*Math.PI;while(c<-Math.PI)c+=2*Math.PI;
  const w=2/0.3,x=w*dt,e=1/(1+x+0.48*x*x+0.235*x*x*x),tmp=(S.hv+w*c)*dt;
  S.hv=(S.hv-w*tmp)*e;S.hs=h+(c+tmp)*e;return S.hs}
function viewTransform(cv,mp=mePos()){   // drawMap passes the frame's one position, so view and arrow agree exactly
  const fx0=mp?mp.x:S.fast?S.fast.x:0,fz0=mp?mp.z:S.fast?-S.fast.z:0;
  const b=S.segBounds||[fx0-300,fz0-300,fx0+300,fz0+300];
  const W=cv.width,H=cv.height,pad=30*(devicePixelRatio||1),bw=Math.max(60,b[2]-b[0]),bh=Math.max(60,b[3]-b[1]);
  const base=Math.min((W-2*pad)/bw,(H-2*pad)/bh),s=base*S.zoom;
  let rot=0,cx=(b[0]+b[2])/2,cz=(b[1]+b[3])/2,ox=W/2,oy=H/2;
  if(S.fast&&(S.mode==='follow'||S.zoom>1)){cx=fx0;cz=fz0}
  if(S.mode==='follow'&&S.fast&&S.hs!=null){rot=-Math.PI/2-S.hs;oy=H*0.62} // direction of travel points up
  const c=Math.cos(rot)*s,sn=Math.sin(rot)*s;
  const m=[c,sn,-sn,c,ox-(cx*c-cz*sn),oy-(cx*sn+cz*c)];
  return {s,m,f:(x,z)=>[m[0]*x+m[2]*z+m[4],m[1]*x+m[3]*z+m[5]]};
}
function drawMap(){
  paintMapPos();
  const cv=$('#map');if(!cv)return;fitCanvas(cv);const g=cv.getContext('2d'),W=cv.width,H=cv.height,dpr=devicePixelRatio||1;
  g.setTransform(1,0,0,1,0,0);if(OBS){g.clearRect(0,0,W,H);if(OBSBG){g.fillStyle=`rgba(18,19,22,${OBSBG/100})`;g.fillRect(0,0,W,H)}}else{g.fillStyle='#121316';g.fillRect(0,0,W,H)}
  smoothHeading();const mpF=mePos(),T=viewTransform(cv,mpF);
  if(!trackPath){trackPath=new Path2D();for(const sg of S.segs){trackPath.moveTo(sg[0],sg[1]);trackPath.lineTo(sg[2],sg[3])}}
  g.setTransform(...T.m);g.lineCap='round';g.lineJoin='round';
  g.strokeStyle='#26282E';g.lineWidth=Math.max(6*dpr/T.s,13);g.stroke(trackPath);
  // a flagged sector (or the whole track under FCY / safety car) glows yellow on the track
  const se=S.slow&&S.slow.session,sb=secBounds();
  if(se){const full=se.phase===6||se.yellow>0,fl=(se.sectorFlags||[]).map(secY);
    if(full||fl.some(Boolean)){
      if(!secPaths&&sb){secPaths=[new Path2D(),new Path2D(),new Path2D()];for(const sg of S.segs){const d=sg[4];if(d==null)continue;const k=d<sb[1]?0:d<sb[2]?1:2;secPaths[k].moveTo(sg[0],sg[1]);secPaths[k].lineTo(sg[2],sg[3])}}
      g.strokeStyle='rgba(255,214,10,.45)';g.lineWidth=Math.max(6*dpr/T.s,13)+4/T.s;
      if(full)g.stroke(trackPath);else if(secPaths)fl.forEach((on,k)=>{if(on)g.stroke(secPaths[k])})}}
  const line=(pts,col,w)=>{if(pts.length<2)return;g.strokeStyle=col;g.lineWidth=w/T.s;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke()};
  line(S.last,'#4A4D56',2*dpr);
  // this lap's trail: green on throttle, red on the brakes, grey with no pedal (v0.1.20)
  (pts=>{if(pts.length<2)return;g.lineWidth=2.5*dpr/T.s;
    const cols=pedalColours(pts);let col=cols[1];g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++){const c=cols[i];if(c!==col){g.lineTo(pts[i][0],pts[i][1]);g.strokeStyle=col;g.stroke();g.beginPath();g.moveTo(pts[i][0],pts[i][1]);col=c}else g.lineTo(pts[i][0],pts[i][1])}
    g.strokeStyle=col;g.stroke()})(S.trail);
  g.setTransform(1,0,0,1,0,0);
  // cars glide from their previous position to the newest one over one frame interval (~100 ms behind live)
  const now=performance.now(),cls=new Map((S.slow?.grid||[]).map(c=>[c.id,c]));
  const list=[...S.cars.values()].sort((a,b)=>a.me-b.me);
  // B: braking points of the class-best lap (purple diamonds, numbered); the ghost ring was removed in v0.1.20
  const R0=S.ref;if(R0&&Array.isArray(R0.corners)){g.font=`${10*dpr}px JetBrains Mono, monospace`;
    for(const c of R0.corners){const a=c.at_brake;if(!a)continue;const p=T.f(a[0],-a[1]);g.fillStyle='#C9A8FF';g.strokeStyle='#121316';g.lineWidth=1.5*dpr;
      g.beginPath();g.moveTo(p[0],p[1]-6*dpr);g.lineTo(p[0]+5*dpr,p[1]);g.lineTo(p[0],p[1]+6*dpr);g.lineTo(p[0]-5*dpr,p[1]);g.closePath();g.fill();g.stroke();g.fillText('T'+c.n,p[0]+7*dpr,p[1]+4*dpr)}}
  const mp=mpF,hs=S.hs;
  for(const c of list){const k=Math.max(0,Math.min(1,(now-c.t)/Math.max(30,c.t-c.pt)));const p=c.me&&mp?T.f(mp.x,mp.z):T.f(c.px+(c.x-c.px)*k,c.pz+(c.z-c.pz)*k);
    const info=cls.get(c.id),r=(c.me?9:7)*dpr;
    g.globalAlpha=c.pits?0.4:1;g.fillStyle=c.me?'#F2C200':CLS(info&&info.class);g.strokeStyle='#121316';g.lineWidth=1.5*dpr;
    if(c.me&&S.hist.length>3&&hs!=null&&mp){const a=S.hist[Math.max(0,S.hist.length-8)],b=S.hist[S.hist.length-1],pb=T.f(mp.x+Math.cos(hs),mp.z+Math.sin(hs));
      const ang=Math.atan2(pb[1]-p[1],pb[0]-p[0]),R=13*dpr;
      if(Math.hypot(b.x-a.x,b.z-a.z)>1){g.save();g.translate(p[0],p[1]);g.rotate(ang);g.beginPath();g.moveTo(R,0);g.lineTo(-R*0.75,R*0.7);g.lineTo(-R*0.35,0);g.lineTo(-R*0.75,-R*0.7);g.closePath();g.fill();g.lineWidth=2*dpr;g.stroke();g.restore()}
      else{g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();g.stroke()}}
    else{g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();g.stroke()}
    g.font=`${11*dpr}px JetBrains Mono, monospace`;g.fillStyle=c.me?'#F2C200':'#8C8F98';g.fillText(String(c.place),p[0]+r+(c.me?8:2)*dpr,p[1]-r);g.globalAlpha=1}
  if(!S.segs.length&&!S.fast){g.fillStyle='#8C8F98';g.font=`${13*dpr}px Inter, sans-serif`;g.fillText('The map appears once cars are moving.',20*dpr,30*dpr)}
  const zv=$('#zv');if(zv)zv.textContent=S.zoom.toFixed(1)+'x';
}
function drawInputs(){
  const cv=$('#inp');if(!cv)return;fitCanvas(cv);const g=cv.getContext('2d'),W=cv.width,H=cv.height,dpr=devicePixelRatio||1;
  g.clearRect(0,0,W,H);const h=S.hist;if(h.length<2)return;const t1=h[h.length-1].et,t0=t1-15;
  const X=et=>(et-t0)/15*W,Y=v=>H-4*dpr-v*(H-8*dpr);
  g.fillStyle='rgba(255,176,32,0.16)';for(const f of h)if(f.flags&1)g.fillRect(X(f.et)-1.5*dpr,0,3*dpr,H);
  g.strokeStyle='#25272C';g.lineWidth=1;g.beginPath();g.moveTo(0,Y(0.5));g.lineTo(W,Y(0.5));g.stroke();
  const tr=(key,col,w,dash)=>{g.strokeStyle=col;g.lineWidth=w*dpr;g.setLineDash(dash?[5*dpr,4*dpr]:[]);g.beginPath();h.forEach((f,i)=>{const v=key==='steer'?0.5+f.steer/2:f[key];const x=X(f.et),y=Y(Math.max(0,Math.min(1,v)));i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.setLineDash([])};
  tr('steer','#C9CBD1',1.2,true);tr('thr','#3BD16F',2);tr('brk','#FF5A5A',2);
  g.fillStyle='#39C5F0';for(const f of h)if(f.flags&0xF0){g.beginPath();g.arc(X(f.et),Y(f.brk),4*dpr,0,7);g.fill()}
  const f=h[h.length-1],ft=$('#inpft');
  if(ft&&(!ft.dataset.t||now()-ft.dataset.t>100)){ft.dataset.t=now();const lock=['FL','FR','RL','RR'].filter((_,i)=>f.flags&(16<<i));
    ft.innerHTML=`<span class="gear">${f.gear<0?'R':f.gear===0?'N':f.gear}</span><span class="spd">${Math.round(f.speed*3.6)}<span class="sm"> km/h</span></span><span class="rpm">${Math.round(f.rpm)}<span class="sm"> rpm</span></span><span class="sm">brake F ${f.bp[0].toFixed(2)} / R ${f.bp[2].toFixed(2)}</span>${f.flags&1?'<span class="a">ABS</span>':''}${f.flags&2?'<span class="a">TC</span>':''}${lock.length?`<span class="c">lock ${lock.join(' ')}</span>`:''}`}
}
const now=()=>performance.now();
let lastTraffic=0;
let lastDraw=0,lastDelta=0;
function frame(t){if(!PHONE||t-lastDraw>=30){lastDraw=t;drawMap();drawInputs()}if(now()-lastDelta>100){lastDelta=now();paintDelta()}if(now()-lastTraffic>500){lastTraffic=now();if(!PHONE)paintTraffic()}requestAnimationFrame(frame)}
checkPhone();
requestAnimationFrame(frame);
addEventListener('pagehide',()=>{if(LINK){const L=LINK;LINK=null;L.stop(true)}});
boot();
</script>
