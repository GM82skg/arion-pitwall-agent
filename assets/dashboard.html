<style>
:root{--bg:#0E0F11;--pn:#16171A;--ln:#2B2D33;--tx:#E6E7EA;--mu:#8C8F98;--y:#F2C200;--g:#3BD16F;--r:#FF5A5A;--a:#FFB020;--c:#39C5F0;--p:#C9A8FF;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:var(--tx);background:#1F2024;border:1px solid var(--ln);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:#4A4D56}
button.on{border-color:var(--y);color:var(--y);background:#3A3000}
input{font:inherit;color:var(--tx);background:#0E0F11;border:1px solid var(--ln);border-radius:6px;padding:9px 11px;width:100%}
.m{font-family:var(--mono)}.mu{color:var(--mu)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.a{color:var(--a)}.c{color:var(--c)}
#app{display:flex;flex-direction:column;height:100vh;padding:10px;gap:10px}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;flex-wrap:wrap}
.wm{display:block;height:24px;width:auto;aspect-ratio:1202/238;color:#F5F5F7}
.brand{display:flex;align-items:center;gap:9px}.brand b{font-weight:600;font-size:15px}
.sep{border-left:1px solid var(--ln);height:22px}
.chip{border-radius:5px;padding:2px 9px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;gap:8px;align-items:center;padding:5px 11px;border-radius:6px;border:1px solid var(--ln);background:#1A1B1F;font-family:var(--mono);font-size:13px;cursor:pointer}
.tab.on{background:#3A3000;border-color:var(--y)}
.grow{flex:1}
.main{flex:1;display:grid;grid-template-columns:420px minmax(0,1fr);gap:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:0}
.ph{display:flex;align-items:center;gap:8px;color:var(--mu);margin-bottom:8px;font-size:13px}
.ph b{font-weight:500;color:#D5D7DC;font-size:14px}
.fill{flex:1;display:flex;flex-direction:column}
.cv{flex:1;position:relative;min-height:0}.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.big{font-family:var(--mono);font-size:20px}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tyre{border-radius:6px;padding:7px 9px;background:#1E2A1F;font-family:var(--mono);font-size:13px}
.bar{height:9px;background:#25272C;border-radius:5px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
.rl{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;font-family:var(--mono);font-size:13px}
.rl.me{border:1px solid var(--y)}
.pill{border-radius:4px;padding:0 6px;font-size:12px;font-family:var(--mono)}
.center{flex:1;display:grid;place-items:center}
.card{width:min(380px,92vw);background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2A1F08;border:1px solid var(--a);padding:8px 14px;border-radius:8px;display:none;z-index:9}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.ft{font-size:12px;color:var(--mu);text-align:center}
@media (max-width:900px){.main{grid-template-columns:1fr}}

<script>
'use strict';
// ARION Pit Wall dashboard — Phase 1. Protocol: PROTOCOL.md in arion-pitwall-agent (version 1).
const VERSION='0.1.2';
// Local mode: the driver app serves this same page on the racing PC ("My dashboard") and sets PW_LOCAL.
const LOCAL=!!window.PW_LOCAL;
const CFG={url:'https://isuiksufkyishdowejob.supabase.co',key:'sb_publishable_DMqGCrW9YEmzEN2_cP67-w_ljr1JBo9'};
const STUN=[{urls:'stun:stun.cloudflare.com:3478'}];
const sb=LOCAL?null:supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let noteT;function note(t){const n=$('#note');n.textContent=t;n.style.display='block';clearTimeout(noteT);noteT=setTimeout(()=>n.style.display='none',5000)}

// ---------- state ----------
let USER=null,TOKEN=null,SESS=[],SEL=null,LINK=null;
const S={fast:null,slow:null,cars:new Map(),hist:[],trail:[],last:[],lap:null,segs:[],cells:new Set(),segBounds:null,trackLen:0,mode:'full',zoom:1,lastPos:new Map(),heading:0};
function resetData(){S.fast=null;S.slow=null;S.cars.clear();S.hist=[];S.trail=[];S.last=[];S.lap=null;S.segs=[];S.cells.clear();S.segBounds=null;S.trackLen=0;S.lastPos.clear();trackPath=null}

// ---------- login and access ----------
async function boot(){
  if(LOCAL)return localBoot();
  const {data:{session}}=await sb.auth.getSession();
  USER=session?.user||null;TOKEN=session?.access_token||null;
  sb.auth.onAuthStateChange((_e,s)=>{TOKEN=s?.access_token||null;const u=s?.user||null;if((u&&u.id)!==(USER&&USER.id)){USER=u;route()}});
  route();
}
async function route(){
  stopLink();
  $('#out').style.display=USER?'':'none';
  if(!USER)return loginView();
  const {data:ok,error}=await sb.rpc('can_pitwall');
  if(error)return msgView('Could not check your access: '+error.message);
  if(!ok)return msgView('No pit wall access. Ask an admin to tick «Pit wall» for you in the crew app (Team → ⋯).');
  dashView();loadSessions();watchSessions();
}
function loginView(){
  $('#tabs').innerHTML='';$('#sess').textContent='';$('#link').textContent='';
  $('#view').className='center';
  $('#view').innerHTML=`<form class="card" id="lf"><div class="mu">Sign in with your ARION crew app account.</div>
    <input id="em" type="email" autocomplete="username" placeholder="Email" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="on" type="submit">Sign in</button><div class="ft">ARION Pit Wall v${VERSION}</div></form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)note(error.message)};
}
function msgView(t){$('#view').className='center';$('#view').innerHTML=`<div class="card"><div>${esc(t)}</div><div class="ft">ARION Pit Wall v${VERSION}</div></div>`}
$('#out').onclick=async()=>{await sb.auth.signOut();USER=null;route()};

// ---------- drivers online (one session per running driver app) ----------
let sessChan=null,sessTimer=null;
async function loadSessions(){
  const {data,error}=await sb.from('pitwall_sessions').select('id,user_id,team_id,agent_version,started_at,last_seen');
  if(error){note(error.message);return}
  const ids=[...new Set(data.map(s=>s.user_id))],tids=[...new Set(data.map(s=>s.team_id).filter(Boolean))];
  const [p,t]=await Promise.all([ids.length?sb.from('profiles').select('id,name,nickname').in('id',ids):{data:[]},tids.length?sb.from('teams').select('id,name,class').in('id',tids):{data:[]}]);
  const pm=new Map((p.data||[]).map(x=>[x.id,x])),tm=new Map((t.data||[]).map(x=>[x.id,x]));
  SESS=data.map(s=>({...s,driver:(pm.get(s.user_id)?.nickname||pm.get(s.user_id)?.name||'Driver'),team:tm.get(s.team_id)||null}))
    .sort((a,b)=>(a.team?.name||'~').localeCompare(b.team?.name||'~')||a.driver.localeCompare(b.driver));
  if(SEL&&!SESS.some(s=>s.id===SEL)){stopLink();SEL=null}
  if(!SEL&&SESS.length)select(SESS[0].id);
  paintTabs();if(!SESS.length)emptyState();
}
function watchSessions(){
  if(sessChan)sb.removeChannel(sessChan);
  sessChan=sb.channel('pw-sessions').on('postgres_changes',{event:'*',schema:'public',table:'pitwall_sessions'},()=>loadSessions()).subscribe();
  clearInterval(sessTimer);sessTimer=setInterval(loadSessions,15000);
}
function paintTabs(){
  $('#tabs').innerHTML=SESS.map((s,i)=>`<span class="tab${s.id===SEL?' on':''}" data-id="${s.id}"><span class="${s.id===SEL?'y':'mu'}">Car ${i+1}</span><span>${esc(s.team?s.team.name:'Practice')}</span><span class="mu">${esc(s.driver)}</span></span>`).join('');
  document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>select(e.dataset.id));
}
function emptyState(){$('#sess').textContent='';$('#link').textContent='';
  const v=$('#view');if(v.dataset.k==='empty')return;v.dataset.k='empty';v.className='center';
  v.innerHTML=`<div class="card"><b>No driver online</b><div class="mu">Drivers appear here while their ARION Pit Wall app is running.</div><div class="ft">ARION Pit Wall v${VERSION}</div></div>`}
function select(id){if(SEL===id&&LINK)return;stopLink();SEL=id;resetData();paintTabs();dashView();startLink(id)}

// ---------- local mode: this PC only, data from the driver app as Server-Sent Events ----------
function localBoot(){
  $('#out').style.display='none';SEL='local';
  $('#tabs').innerHTML=`<span class="tab on"><span class="y">My car</span><span class="mu">this PC</span></span>`;
  dashView();LINK=new LocalLink();
}
class LocalLink{
  constructor(){this.state='connecting';this.alive=true;this.es=new EventSource('/events');
    const b64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
    this.es.onopen=()=>{this.state='live';paintLink()};
    this.es.onerror=()=>{if(this.alive){this.state='reconnecting';paintLink()}};
    this.es.addEventListener('fast',e=>{try{onFast(b64(e.data))}catch{}});
    this.es.addEventListener('slow',e=>{try{onSlow(JSON.parse(e.data))}catch{}});
    paintLink()}
  stop(){this.alive=false;this.es.close()}
}

// ---------- the live connection (WebRTC; setup messages go through the database) ----------
function stopLink(){if(!LINK)return;const L=LINK;LINK=null;L.stop()}
function startLink(sid){LINK=new Link(sid)}
class Link{
  constructor(sid){this.sid=sid;this.alive=true;this.tries=0;this.lastId=0;this.rtt=null;this.path='';this.state='connecting';this.open()}
  async open(){
    if(!this.alive)return;this.state='connecting';this.answered=false;paintLink();
    const pc=this.pc=new RTCPeerConnection({iceServers:STUN});
    const fast=pc.createDataChannel('fast',{ordered:false,maxRetransmits:0}),slow=pc.createDataChannel('slow');
    fast.binaryType='arraybuffer';fast.onmessage=e=>onFast(e.data);
    slow.onmessage=e=>{const t=String(e.data);if(t.startsWith('q:')){this.rtt=performance.now()-parseFloat(t.slice(2));return}try{onSlow(JSON.parse(t))}catch{}};
    slow.onopen=()=>{this.ping=setInterval(()=>{try{slow.send('p:'+performance.now())}catch{}},1000)};
    pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(!this.alive)return;
      if(s==='connected'){this.state='live';this.tries=0;this.stats()}
      if(s==='failed'||s==='disconnected'&&this.state!=='live')this.retry('failed');
      if(s==='disconnected'&&this.state==='live'){this.state='reconnecting';setTimeout(()=>{if(this.alive&&pc.connectionState==='disconnected')this.retry('lost')},5000)}
      paintLink()};
    await pc.setLocalDescription(await pc.createOffer());
    // send what we have after at most 1.5 s: some networks never report gathering "complete"
    await new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();setTimeout(r,1500)});
    if(!this.alive)return;
    this.chan=sb.channel('pw-sig-'+this.sid+'-'+Date.now()).on('postgres_changes',{event:'INSERT',schema:'public',table:'pitwall_signals',filter:'session_id=eq.'+this.sid},p=>this.signal(p.new)).subscribe();
    const {error}=await sb.from('pitwall_signals').insert({session_id:this.sid,kind:'offer',body:pc.localDescription.toJSON()});
    if(error){note(error.message);return this.retry('offer')}
    // backup to the live updates: ask every second until the answer is here
    this.poll=setInterval(async()=>{if(this.answered)return;const {data}=await sb.from('pitwall_signals').select('id,kind,body,from_agent').eq('session_id',this.sid).eq('from_agent',true).gt('id',this.lastId).order('id');(data||[]).forEach(s=>this.signal(s))},1000);
    this.timeout=setTimeout(()=>{if(!this.answered)this.retry('no answer')},15000);
  }
  async signal(s){
    if(!s||!s.from_agent||s.id<=this.lastId)return;this.lastId=s.id;
    if(s.kind==='answer'&&!this.answered){this.answered=true;try{await this.pc.setRemoteDescription(s.body)}catch(e){this.retry('bad answer')}}
    if(s.kind==='bye'){this.answered=true;const why=s.body&&s.body.reason;
      if(why==='full'){this.state='full';paintLink();this.close();setTimeout(()=>this.alive&&this.open(),20000)}else this.retry('closed')}
  }
  async stats(){
    if(!this.alive||!this.pc)return;
    try{const st=await this.pc.getStats();let pair=null;st.forEach(r=>{if(r.type==='transport'&&r.selectedCandidatePairId)pair=st.get(r.selectedCandidatePairId)});
      if(!pair)st.forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.state==='succeeded')pair=r});
      if(pair){const l=st.get(pair.localCandidateId),rm=st.get(pair.remoteCandidateId);if(pair.currentRoundTripTime!=null)this.netRtt=pair.currentRoundTripTime*1000;
        this.path=(l&&rm)?((l.candidateType==='relay'||rm.candidateType==='relay')?'relay':'direct'):'';}}catch{}
    paintLink();setTimeout(()=>this.stats(),3000);
  }
  close(){clearInterval(this.ping);clearInterval(this.poll);clearTimeout(this.timeout);if(this.chan)sb.removeChannel(this.chan);this.chan=null;try{this.pc&&this.pc.close()}catch{}}
  retry(why){if(!this.alive)return;this.close();this.tries++;
    if(this.tries>3){this.state='failed';paintLink();return}
    this.state='reconnecting';paintLink();setTimeout(()=>this.open(),1000*this.tries)}
  // Tell the driver's app this coach left, so the place is free at once.
  // When the page is closing, a normal request may be cut off; keepalive lets it finish.
  stop(unloading){this.alive=false;this.close();
    if(unloading&&TOKEN){try{fetch(CFG.url+'/rest/v1/pitwall_signals',{method:'POST',keepalive:true,
      headers:{apikey:CFG.key,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({session_id:this.sid,kind:'bye',body:{}})})}catch{}}
    else sb.from('pitwall_signals').insert({session_id:this.sid,kind:'bye',body:{}}).then(()=>{})}
}
function paintLink(){const L=LINK,e=$('#link');if(!L){e.textContent='';return}
  if(LOCAL){e.innerHTML=L.state==='live'?'<span class="g">● live</span> · this PC':L.state==='reconnecting'?'<span class="a">● the ARION Pit Wall app isn’t answering — is it still running?</span>':'<span class="a">● connecting…</span>';return}
  const m={connecting:['a','connecting…'],live:['g','live'],reconnecting:['a','reconnecting…'],full:['a','5 coaches already watching this driver'],
    failed:['r','no direct connection to this driver (network blocks it)']}[L.state]||['mu',L.state];
  e.innerHTML=`<span class="${m[0]}">● ${m[1]}</span>${L.state==='live'?` · ${L.netRtt!=null?Math.round(L.netRtt)+' ms':L.rtt!=null?Math.round(L.rtt)+' ms':'…'}${L.path?' · '+L.path:''}`:''}`}

// ---------- incoming data (PROTOCOL.md v1) ----------
function onFast(buf){
  const d=new DataView(buf);if(d.byteLength<4||d.getUint8(0)!==1)return;
  const k=d.getUint8(1);
  if(k===1&&d.byteLength>=76){
    const f={t:performance.now(),flags:d.getUint16(2,true),seq:d.getUint32(4,true),et:d.getFloat64(8,true),dist:d.getFloat32(16,true),lap:d.getInt16(20,true),gear:d.getInt8(22),
      x:d.getFloat32(24,true),y:d.getFloat32(28,true),z:d.getFloat32(32,true),speed:d.getFloat32(36,true),rpm:d.getFloat32(40,true),thr:d.getFloat32(44,true),brk:d.getFloat32(48,true),
      steer:d.getFloat32(52,true),clutch:d.getFloat32(56,true),bp:[60,64,68,72].map(o=>d.getFloat32(o,true))};
    if(S.lap!==null&&f.lap!==S.lap){S.last=S.trail;S.trail=[]}
    S.lap=f.lap;
    const p=S.hist.length>10?S.hist[S.hist.length-10]:S.fast;if(p){const dx=f.x-p.x,dz=f.z-p.z;if(dx*dx+dz*dz>1)S.heading=Math.atan2(-dz,dx)}
    S.fast=f;S.trail.push([f.x,-f.z]);if(S.trail.length>20000)S.trail.shift();
    S.hist.push(f);while(S.hist.length&&f.et-S.hist[0].et>15)S.hist.shift();
    if(f.dist>S.trackLen)S.trackLen=f.dist;
  }
  if(k===2){
    const n=d.getUint16(2,true);const seen=new Set();
    for(let i=0;i<n&&4+i*16+16<=d.byteLength;i++){const o=4+i*16,id=d.getUint16(o,true),place=d.getUint8(o+2),b=d.getUint8(o+3),x=d.getFloat32(o+4,true),z=-d.getFloat32(o+8,true),dist=d.getFloat32(o+12,true);
      seen.add(id);const prev=S.lastPos.get(id);
      // the track draws itself from where cars drive (not in the pits; no jumps)
      if(prev&&!(b&1)){const dx=x-prev[0],dz=z-prev[1],dd=dx*dx+dz*dz;const key=Math.round((x+prev[0])/6)+','+Math.round((z+prev[1])/6);
        if(dd>0.04&&dd<3600&&!S.cells.has(key)&&S.segs.length<60000){S.cells.add(key);S.segs.push([prev[0],prev[1],x,z]);growBounds(x,z);trackPath=null}}
      S.lastPos.set(id,[x,z]);const old=S.cars.get(id),tn=performance.now();S.cars.set(id,{id,place,pits:!!(b&1),me:!!(b&2),x,z,dist,t:tn,px:old?old.x:x,pz:old?old.z:z,pt:old?old.t:tn-100});
      if(dist>S.trackLen)S.trackLen=dist}
    for(const id of S.cars.keys())if(!seen.has(id))S.cars.delete(id);
  }
}
function growBounds(x,z){const b=S.segBounds;if(!b){S.segBounds=[x,z,x,z];return}
  b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],z);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],z)}
function onSlow(j){if(j.t!=='slow')return;S.slow=j;paintPanels()}

// ---------- layout ----------
function dashView(){
  const v=$('#view');if(v.dataset.k==='dash')return;v.dataset.k='dash';v.className='main';
  v.innerHTML=`<div class="col">
      <div class="pn" id="car"></div>
      <div class="pn fill"><div class="ph"><b>Traffic</b><span class="mu">all classes, by track position · <span class="y">●</span> your class</span></div><div id="traffic"></div></div>
    </div>
    <div class="col">
      <div class="pn fill" style="flex:3">
        <div class="ph"><b>Track map</b><span class="grow"></span>
          <button id="mFull" class="on">Full track</button><button id="mFollow">Follow</button>
          <button id="zOut">−</button><span id="zv" class="m">1.0x</span><button id="zIn">+</button></div>
        <div class="cv"><canvas id="map"></canvas></div>
        <div class="lg"><span class="y">● this car</span><span>trail: <span class="y">this lap</span>, <span class="mu">last lap</span></span><span>cars: <span style="color:#D9D9DE">Hypercar</span> · <span style="color:#3E7BFA">LMP2</span> · <span style="color:#F08C2E">GT3</span> · <span style="color:#3BD16F">GTE</span> · <span class="mu">other</span></span><span class="mu">The track draws itself from where cars drive.</span></div>
      </div>
      <div class="pn fill" style="flex:1.2">
        <div class="ph"><b>Live inputs</b><span class="g">throttle</span><span class="r">brake</span><span>steering</span><span class="a">ABS active</span><span class="c">wheel lock</span><span class="grow"></span><span class="mu">last 15 s</span></div>
        <div class="cv"><canvas id="inp"></canvas></div>
        <div class="m" id="inpft" style="display:flex;gap:18px;margin-top:6px"></div>
      </div>
    </div>`;
  $('#mFull').onclick=()=>{S.mode='full';$('#mFull').className='on';$('#mFollow').className=''};
  $('#mFollow').onclick=()=>{S.mode='follow';$('#mFollow').className='on';$('#mFull').className='';if(S.zoom<2)S.zoom=3};
  $('#zIn').onclick=()=>{S.zoom=Math.min(12,S.zoom*1.5)};$('#zOut').onclick=()=>{S.zoom=Math.max(1,S.zoom/1.5)};
  paintPanels();
}

const CLS=c=>{c=(c||'').toLowerCase();return c.includes('hyper')?'#D9D9DE':c.includes('lmp2')?'#3E7BFA':c.includes('lmp3')?'#B07CFF':c.includes('gt3')?'#F08C2E':c.includes('gte')?'#3BD16F':'#8C8F98'};
const CLSN=c=>{c=(c||'').toLowerCase();return c.includes('hyper')?'HY':c.includes('lmp2')?'P2':c.includes('lmp3')?'P3':c.includes('gt3')?'GT3':c.includes('gte')?'GTE':(c||'?').slice(0,3).toUpperCase()};
const fmtLap=t=>!(t>0)?'–':`${Math.floor(t/60)}:${(t%60).toFixed(3).padStart(6,'0')}`;
const SESSN=n=>n===0?'Test day':n<=4?`Practice ${n}`:n<=8?`Qualifying ${n-4}`:n===9?'Warm-up':`Race ${n-9}`;
const fmtLeft=s=>!(s>0)?'':`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')} left`;
const tyreBg=t=>t<60?'#16263A':t<95?'#1E2A1F':t<110?'#3A2A12':'#3A1616';

function paintPanels(){
  const j=S.slow,car=$('#car');if(!car)return;
  const sel=SESS.find(s=>s.id===SEL);
  if(j){const se=j.session;$('#sess').innerHTML=`${esc(se.track)} · ${SESSN(se.type)} · ${fmtLeft(se.left)}`+(se.yellow>0?' · <span class="a">yellow</span>':'')}
  if(!j){car.innerHTML=`<div class="ph"><b>${esc(sel?sel.driver:'')}</b><span class="mu">${esc(sel&&sel.team?sel.team.name:'practice')}</span></div><div class="mu">${LINK&&LINK.state==='live'?(LOCAL?'Waiting for Le Mans Ultimate (on track)…':'Waiting for the driver to be on track…'):'Connecting to the driver’s app…'}</div>`;$('#traffic').innerHTML='';return}
  const me=j.grid.find(g=>g.player)||{},c=j.car,w=c.wheels||[];
  const cls=me.class,inCls=j.grid.filter(g=>g.class===cls).sort((a,b)=>a.place-b.place),pic=inCls.findIndex(g=>g.id===me.id)+1;
  const energy=(c.energy>=0&&c.energy<=1)?`${Math.round(c.energy*100)}%`:'–';
  const dmg=(c.damage||[]).some(x=>x>0);
  car.innerHTML=`<div class="ph"><b>${esc(sel?sel.driver:me.name)}</b><span class="chip" style="background:#1F2024">P${pic||'–'} in ${esc(CLSN(cls))}</span><span class="mu">${esc(me.car||'')}</span></div>
    <div class="k3"><div><div class="mu">Last lap</div><div class="big">${fmtLap(me.last)}</div></div><div><div class="mu">Best lap</div><div class="big g">${fmtLap(me.best)}</div></div><div><div class="mu">Laps</div><div class="big">${me.laps??'–'}</div></div></div>
    <div style="display:flex;margin-top:10px"><span class="mu">Virtual energy</span><span class="grow"></span><span class="m">${energy}</span></div><div class="bar"><i style="width:${c.energy>=0&&c.energy<=1?c.energy*100:0}%"></i></div>
    <div style="display:flex;margin-top:6px"><span class="mu">Fuel</span><span class="grow"></span><span class="m">${(c.fuel||0).toFixed(1)} / ${(c.fuelCap||0).toFixed(0)} L</span></div>
    <div class="tyres">${['FL','FR','RL','RR'].map((n,i)=>{const t=w[i]||{t:[0,0,0]};const mid=t.t[1];return `<div class="tyre" style="background:${tyreBg(mid)}">${n} <span style="font-size:16px">${Math.round(mid)}°</span> <span class="mu">${t.t.map(x=>Math.round(x)).join('·')}</span><div class="mu">${Math.round(t.p||0)} kPa · tread ${Math.round((t.wear||0)*100)}% · brake ${Math.round(t.brake||0)}°</div></div>`}).join('')}</div>
    <div class="k3 m" style="grid-template-columns:repeat(5,1fr);margin-top:10px"><div><div class="mu">TC</div>${c.tc}</div><div><div class="mu">ABS</div>${c.abs}</div><div><div class="mu">Bias</div>${(c.bias*100).toFixed(1)}%</div><div><div class="mu">Map</div>${c.map}</div><div><div class="mu">Damage</div>${dmg?'<span class="r">yes</span>':'<span class="g">none</span>'}</div></div>`;
  paintTraffic();
}
function paintTraffic(){
  const j=S.slow,el=$('#traffic');if(!j||!el)return;
  const me=j.grid.find(g=>g.player);const meCar=me&&S.cars.get(me.id);const L=S.trackLen;
  if(!me||!meCar||!(L>100)){el.innerHTML='<div class="mu">Waiting for positions…</div>';return}
  const v=me.best>0?L/me.best:(S.fast&&S.fast.speed>10?S.fast.speed:50);
  const rows=j.grid.filter(g=>S.cars.has(g.id)&&!S.cars.get(g.id).pits||g.player).map(g=>{let d=(S.cars.get(g.id)?.dist??0)-meCar.dist;if(d>L/2)d-=L;if(d<-L/2)d+=L;return {g,d}}).sort((a,b)=>b.d-a.d);
  const i=rows.findIndex(r=>r.g.player);const fit=Math.max(3,Math.floor((el.parentElement.clientHeight-40)/25)),half=Math.floor((fit-1)/2);
  const st=Math.max(0,Math.min(i-half,rows.length-fit));const view=rows.slice(st,st+fit);
  el.innerHTML=view.map(({g,d})=>{const s=Math.abs(d)/v;const same=g.class===me.class;
    return `<div class="rl${g.player?' me':''}"><span class="pill" style="background:${CLS(g.class)};color:#16171A">${esc(CLSN(g.class))}</span><span class="mu">P${g.place}</span><span style="${g.player?'color:var(--y)':''}">${esc(g.name)}</span><span class="grow"></span>${g.player?'<span class="y">you</span>':`<span>${s.toFixed(1)} s ${d>0?'ahead':'behind'}</span>${same?'<span class="y">●</span>':''}`}</div>`}).join('');
}

// ---------- drawing (every frame; the track is one world-space path, rebuilt only when it grows) ----------
let trackPath=null;
function fitCanvas(cv){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
// world (x, −z) → screen, as a matrix [a,b,c,d,e,f] for setTransform, and as a point function
function viewTransform(cv){
  const fx0=S.fast?S.fast.x:0,fz0=S.fast?-S.fast.z:0;
  const b=S.segBounds||[fx0-300,fz0-300,fx0+300,fz0+300];
  const W=cv.width,H=cv.height,pad=30*(devicePixelRatio||1),bw=Math.max(60,b[2]-b[0]),bh=Math.max(60,b[3]-b[1]);
  const base=Math.min((W-2*pad)/bw,(H-2*pad)/bh),s=base*S.zoom;
  let rot=0,cx=(b[0]+b[2])/2,cz=(b[1]+b[3])/2,ox=W/2,oy=H/2;
  if(S.fast&&(S.mode==='follow'||S.zoom>1)){cx=fx0;cz=fz0}
  if(S.mode==='follow'&&S.fast){rot=-Math.PI/2-S.heading;oy=H*0.62} // direction of travel points up
  const c=Math.cos(rot)*s,sn=Math.sin(rot)*s;
  const m=[c,sn,-sn,c,ox-(cx*c-cz*sn),oy-(cx*sn+cz*c)];
  return {s,m,f:(x,z)=>[m[0]*x+m[2]*z+m[4],m[1]*x+m[3]*z+m[5]]};
}
function drawMap(){
  const cv=$('#map');if(!cv)return;fitCanvas(cv);const g=cv.getContext('2d'),W=cv.width,H=cv.height,dpr=devicePixelRatio||1;
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#121316';g.fillRect(0,0,W,H);
  const T=viewTransform(cv);
  if(!trackPath){trackPath=new Path2D();for(const sg of S.segs){trackPath.moveTo(sg[0],sg[1]);trackPath.lineTo(sg[2],sg[3])}}
  g.setTransform(...T.m);g.lineCap='round';g.lineJoin='round';
  g.strokeStyle='#26282E';g.lineWidth=Math.max(6*dpr/T.s,13);g.stroke(trackPath);
  const line=(pts,col,w)=>{if(pts.length<2)return;g.strokeStyle=col;g.lineWidth=w/T.s;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.stroke()};
  line(S.last,'#4A4D56',2*dpr);line(S.trail,'#F2C200',2.5*dpr);
  g.setTransform(1,0,0,1,0,0);
  // cars glide from their previous position to the newest one over one frame interval (~100 ms behind live)
  const now=performance.now(),cls=new Map((S.slow?.grid||[]).map(c=>[c.id,c]));
  const list=[...S.cars.values()].sort((a,b)=>a.me-b.me);
  for(const c of list){const k=Math.max(0,Math.min(1,(now-c.t)/Math.max(30,c.t-c.pt)));const p=T.f(c.px+(c.x-c.px)*k,c.pz+(c.z-c.pz)*k);
    const info=cls.get(c.id),r=(c.me?7:5)*dpr;
    g.globalAlpha=c.pits?0.4:1;g.fillStyle=c.me?'#F2C200':CLS(info&&info.class);g.strokeStyle='#121316';g.lineWidth=1.5*dpr;
    g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();g.stroke();
    g.font=`${11*dpr}px JetBrains Mono, monospace`;g.fillStyle=c.me?'#F2C200':'#8C8F98';g.fillText(String(c.place),p[0]+r+2*dpr,p[1]-r);g.globalAlpha=1}
  if(!S.segs.length&&!S.fast){g.fillStyle='#8C8F98';g.font=`${13*dpr}px Inter, sans-serif`;g.fillText('The map appears once cars are moving.',20*dpr,30*dpr)}
  const zv=$('#zv');if(zv)zv.textContent=S.zoom.toFixed(1)+'x';
}
function drawInputs(){
  const cv=$('#inp');if(!cv)return;fitCanvas(cv);const g=cv.getContext('2d'),W=cv.width,H=cv.height,dpr=devicePixelRatio||1;
  g.clearRect(0,0,W,H);const h=S.hist;if(h.length<2)return;const t1=h[h.length-1].et,t0=t1-15;
  const X=et=>(et-t0)/15*W,Y=v=>H-4*dpr-v*(H-8*dpr);
  g.fillStyle='rgba(255,176,32,0.16)';for(const f of h)if(f.flags&1)g.fillRect(X(f.et)-1.5*dpr,0,3*dpr,H);
  g.strokeStyle='#25272C';g.lineWidth=1;g.beginPath();g.moveTo(0,Y(0.5));g.lineTo(W,Y(0.5));g.stroke();
  const tr=(key,col,w,dash)=>{g.strokeStyle=col;g.lineWidth=w*dpr;g.setLineDash(dash?[5*dpr,4*dpr]:[]);g.beginPath();h.forEach((f,i)=>{const v=key==='steer'?0.5+f.steer/2:f[key];const x=X(f.et),y=Y(Math.max(0,Math.min(1,v)));i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.setLineDash([])};
  tr('steer','#C9CBD1',1.2,true);tr('thr','#3BD16F',2);tr('brk','#FF5A5A',2);
  g.fillStyle='#39C5F0';for(const f of h)if(f.flags&0xF0){g.beginPath();g.arc(X(f.et),Y(f.brk),4*dpr,0,7);g.fill()}
  const f=h[h.length-1],ft=$('#inpft');
  if(ft&&(!ft.dataset.t||now()-ft.dataset.t>100)){ft.dataset.t=now();const lock=['FL','FR','RL','RR'].filter((_,i)=>f.flags&(16<<i));
    ft.innerHTML=`<span>Gear ${f.gear<0?'R':f.gear===0?'N':f.gear}</span><span>${Math.round(f.speed*3.6)} km/h</span><span class="mu">${Math.round(f.rpm)} rpm</span><span class="mu">Brake F ${f.bp[0].toFixed(2)} / R ${f.bp[2].toFixed(2)}</span>${f.flags&1?'<span class="a">ABS</span>':''}${f.flags&2?'<span class="a">TC</span>':''}${lock.length?`<span class="c">lock ${lock.join(' ')}</span>`:''}`}
}
const now=()=>performance.now();
let lastTraffic=0;
function frame(){drawMap();drawInputs();if(now()-lastTraffic>500){lastTraffic=now();paintTraffic()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
addEventListener('pagehide',()=>{if(LINK){const L=LINK;LINK=null;L.stop(true)}});
boot();
</script>
